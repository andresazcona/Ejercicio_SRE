server.port=8081
spring.application.name=order-service

# URL del product-service (sobreescribible via env var en Docker)
services.product.url=http://product-service:8082

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Log pattern con traceId/spanId para correlación (rellenados por el OTel Agent via MDC)
logging.pattern.console=%d{HH:mm:ss.SSS} %5p [${spring.application.name},%X{trace_id},%X{span_id}] %logger{20} - %m%n
