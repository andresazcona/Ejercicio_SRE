server.port=8082
spring.application.name=product-service

# DataSource (hostname 'mysql' = nombre del servicio en Docker Compose)
spring.datasource.url=jdbc:mysql://mysql:3306/products_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Log pattern con traceId/spanId para correlación (rellenados por el OTel Agent via MDC)
logging.pattern.console=%d{HH:mm:ss.SSS} %5p [${spring.application.name},%X{trace_id},%X{span_id}] %logger{20} - %m%n
